[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-nids"
version = "0.1.0"
description = "Confidence-aware explainable NIDS research prototype"
requires-python = ">=3.11,<3.13"
dependencies = ["pandas>=2.1,<3.0", "numpy>=1.26,<2.3", "scikit-learn>=1.6,<1.8", "matplotlib>=3.8,<4", "joblib>=1.3,<2", "fastapi>=0.110,<0.116", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3", "shap>=0.45,<0.51", "python-multipart>=0.0.9,<1", "PyYAML>=6.0,<7", "requests>=2.31,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<0.29", "ruff>=0.3,<1"]
dashboard = ["streamlit>=1.32,<2"]

[project.scripts]
nids = "nids.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
